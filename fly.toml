# Fly.io app config for the Go game server.
# Deploy: flyctl deploy (from repo root). Free-tier friendly.

app = "krill-billion"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PACKS_DIR = "/app/packs"
  # Set FRONTEND_ORIGIN via `fly secrets set FRONTEND_ORIGIN=https://your-app.vercel.app`

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
