# Fly.io app config for the Go game server.
# Deploy: flyctl deploy (from repo root). Free-tier friendly.

app = "krill-billion"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PACKS_DIR = "/app/packs"
  # Set FRONTEND_ORIGIN via `fly secrets set FRONTEND_ORIGIN=https://your-app.vercel.app`
  # Optional answer bank (unset → packs/*.json):
  # fly secrets set SUPABASE_URL=https://<ref>.supabase.co SUPABASE_DB_URL=postgresql://...
  # or SUPABASE_SERVICE_ROLE_KEY instead of SUPABASE_DB_URL. Run db/migrations/001_answer_bank.sql first.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

[[vm]]
  size = "shared-cpu-1x"
  # Deep answer bank needs headroom; 256mb OOMed around ~295k entries.
  memory = "1gb"
  cpus = 1
