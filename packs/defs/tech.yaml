prompts:
  - id: tech-company
    category: Tech companies
    text: A tech company
    sparql: |
      SELECT ?item ?itemLabel ?article (GROUP_CONCAT(DISTINCT ?alias; separator="|") AS ?aliases) WHERE {
        VALUES ?item {
          wd:Q2283 wd:Q312 wd:Q95 wd:Q3884 wd:Q380 wd:Q20800404
          wd:Q37156 wd:Q182477 wd:Q478214 wd:Q248 wd:Q128896
          wd:Q19900 wd:Q941127 wd:Q11463 wd:Q173395 wd:Q14799
          wd:Q552581 wd:Q21404084 wd:Q20718 wd:Q41187 wd:Q907311
          wd:Q689141 wd:Q780442 wd:Q63327
        }
        ?article schema:about ?item ;
                 schema:isPartOf <https://en.wikipedia.org/> .
        OPTIONAL {
          ?item skos:altLabel ?alias .
          FILTER(LANG(?alias) = "en")
        }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      }
      GROUP BY ?item ?itemLabel ?article

