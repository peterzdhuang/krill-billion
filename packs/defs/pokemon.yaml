prompts:
  - id: pokemon-gen1
    category: Pokemon
    text: A Pokémon introduced in Generation I
    check: pokeapi
    sparql: |
      SELECT ?item ?itemLabel ?article (GROUP_CONCAT(DISTINCT ?alias; separator="|") AS ?aliases) WHERE {
        ?item wdt:P31/wdt:P279* wd:Q3966183 ;
              wdt:P4584 wd:Q27118928 .
        ?article schema:about ?item ;
                 schema:isPartOf <https://en.wikipedia.org/> .
        OPTIONAL {
          ?item skos:altLabel ?alias .
          FILTER(LANG(?alias) = "en")
        }
        SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
      }
      GROUP BY ?item ?itemLabel ?article

